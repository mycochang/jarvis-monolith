[project]
name = "jarvis-monolith"
version = "1.0.0"
description = "A zero-latency voice dictation monolith using faster-whisper and evdev."
requires-python = ">=3.10"
dependencies = [
    "faster-whisper",
    "sounddevice",
    "numpy",
    "scipy",
    "evdev",
    "moonshine-voice>=0.0.59",
    "setuptools>=82.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]
