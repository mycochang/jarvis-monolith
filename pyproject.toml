[project]
name = "jarvis-monolith"
version = "1.0.0"
description = "A zero-latency voice dictation monolith using faster-whisper and evdev."
requires-python = ">=3.10"
dependencies = [
    "faster-whisper",
    "sounddevice",
    "numpy",
    "scipy",
    "evdev",
    "useful-moonshine>=20241016",
    "onnxruntime==1.19.2",
    "moonshine-voice>=0.0.59",
]
